# =============================================================================
# ToothCare Hub — Hardened Production Nginx Configuration (Phase 20)
# =============================================================================
# Public Port 80:
#   /           -> Compiled React SPA (/var/www/frontend/dist) + history fallback
#   /assets/    -> Fingerprinted Vite assets (immutable 1-year cache)
#   /api/       -> PHP-FPM FastCGI (front controller only; blocks internal/metrics)
#   /socket.io/ -> Node.js Socket.IO WebSocket proxy (HTTP/1.1 Upgrade)
#   /health     -> Nginx liveness endpoint
#
# Internal-Only Port 8081 (never published to host):
#   /api/v1/internal/ -> HMAC-signed PHP <-> Node.js verification
#   /api/v1/metrics   -> Prometheus application/outbox scrape endpoint
#   /stub_status      -> Nginx Prometheus Exporter scrape endpoint
# =============================================================================

server {
    listen 80 default_server;
    server_name _;

    resolver 127.0.0.11 valid=5s ipv6=off;
    set $php_fpm_upstream "php-fpm:9000";
    set $realtime_upstream "http://realtime:4000";

    root /var/www/frontend/dist;
    index index.html;
    charset utf-8;
    autoindex off;
    server_tokens off;

    # Centralized hardened security headers
    include /etc/nginx/snippets/security-headers.conf;

    # Request size & timeout safeguards
    client_max_body_size 5m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;

    # Nginx self health check endpoint
    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"healthy","service":"toothcare-nginx","timestamp":"$time_iso8601"}\n';
    }

    # Fingerprinted Vite static assets (immutable long-term cache)
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Never cache SPA entry document so new releases activate immediately
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Frontend SPA history fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Block internal service-to-service endpoints & raw Prometheus metrics on public edge
    location ^~ /api/v1/internal/ {
        deny all;
        return 403;
    }

    location = /api/v1/metrics {
        deny all;
        return 403;
    }

    location = /stub_status {
        deny all;
        return 403;
    }

    # Backend PHP API via FastCGI (strictly front controller — no arbitrary .php execution)
    location /api/ {
        client_max_body_size 5m;
        fastcgi_pass $php_fpm_upstream;
        include /etc/nginx/snippets/fastcgi-params.conf;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param DOCUMENT_ROOT /var/www/backend/public;
        fastcgi_intercept_errors off;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;
    }

    # Socket.IO Real-Time WebSocket Proxy (WSS when behind TLS)
    location /socket.io/ {
        proxy_pass $realtime_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    # Deny dotfiles (.env, .git, etc.) except ACME HTTP-01 challenge
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny sensitive backend paths & file extensions
    location ~* /(config|src|tests|vendor|storage|database)/ {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(env|git|yml|yaml|sql|md|log|ini|sh|bak|php)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# =============================================================================
# Internal-Only Docker Network Listener (Port 8081 — NEVER published to host)
# =============================================================================
server {
    listen 8081;
    server_name _;
    server_tokens off;

    resolver 127.0.0.11 valid=5s ipv6=off;
    set $php_fpm_upstream "php-fpm:9000";

    location ^~ /api/v1/internal/ {
        client_max_body_size 256k;
        fastcgi_pass $php_fpm_upstream;
        include /etc/nginx/snippets/fastcgi-params.conf;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param DOCUMENT_ROOT /var/www/backend/public;
        fastcgi_intercept_errors off;
    }

    location = /api/v1/metrics {
        fastcgi_pass $php_fpm_upstream;
        include /etc/nginx/snippets/fastcgi-params.conf;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param DOCUMENT_ROOT /var/www/backend/public;
        fastcgi_intercept_errors off;
    }

    location = /stub_status {
        stub_status on;
        access_log off;
    }

    location / {
        return 404;
    }
}
