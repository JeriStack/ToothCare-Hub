# =============================================================================
# ToothCare Hub - Development Docker Compose Overrides
# Usage: docker compose -f compose.yaml -f compose.dev.yaml up -d
# =============================================================================

services:
  nginx:
    ports:
      - "${NGINX_HTTP_PORT:-${NGINX_PORT:-8080}}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./frontend/dist:/var/www/frontend/dist:ro
      - ./backend/public:/var/www/backend/public:ro

  php-fpm:
    volumes:
      - ./backend:/var/www/backend
      - ./docker/php/dev-opcache.ini:/usr/local/etc/php/conf.d/zz-toothcare-dev.ini:ro
    environment:
      APP_DEBUG: "true"
      APP_ENV: "development"

  mysql:
    ports:
      - "127.0.0.1:3306:3306"

  realtime:
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ./realtime:/app
      - /app/node_modules
      - /app/dist

  realtime-worker:
    volumes:
      - ./backend:/var/www/backend

  email-worker:
    volumes:
      - ./backend:/var/www/backend

  mailpit:
    image: axllent/mailpit:v1.34
    container_name: toothcare-mailpit
    profiles:
      - mail
      - dev
      - local
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_WEB_PORT:-8025}:8025"
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "/mailpit readyz || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped

  reminder-scheduler:
    volumes:
      - ./backend:/var/www/backend

  db-backup:
    volumes:
      - ./backups:/var/www/backups
      - ./database/scripts:/var/www/backend/database/scripts:ro

  prometheus:
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"

  # Optional dev container for Vite development with HMR
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: toothcare-frontend-dev
    profiles:
      - frontend-dev
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - edge

  # Optional offline standalone Swagger UI container (development only)
  # Note: Built-in Swagger UI with automatic CSRF injection is also live at http://localhost:8080/api-docs
  swagger-ui:
    image: swaggerapi/swagger-ui:v5.17.14
    container_name: toothcare-swagger-ui
    stop_signal: SIGQUIT
    profiles:
      - docs
    ports:
      - "127.0.0.1:${SWAGGER_UI_PORT:-8082}:8080"
    environment:
      SWAGGER_JSON: /spec/openapi.yaml
      DEEP_LINKING: "true"
      FILTER: "true"
      DISPLAY_REQUEST_DURATION: "true"
    volumes:
      - ./docs/openapi.yaml:/spec/openapi.yaml:ro
    networks:
      - edge
    restart: unless-stopped
