groups:
  - name: toothcare-alerts
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Prometheus target is down: {{ $labels.job }}"
          description: "Container target {{ $labels.instance }} has been unreachable for more than 1 minute."

      - alert: ApiHigh5xxRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Elevated HTTP 5xx error rate"
          description: "More than 5% of API requests returned 5xx errors over the last 5 minutes."

      - alert: ApiHighLatency
        expr: http_request_duration_seconds{quantile="0.95"} > 1.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High API response latency"
          description: "95th percentile request latency exceeds 1.5 seconds."

      - alert: RealtimeUnavailable
        expr: up{job="toothcare-realtime"} == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Socket.IO real-time service unavailable"
          description: "Real-time notification engine is down. In-app notifications will fall back to REST."
  - name: toothcare-email
    rules:
      - alert: EmailJobsExhausted
        expr: toothcare_email_jobs_exhausted > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Email jobs exhausted all delivery attempts"
          description: "{{ $value }} email job(s) failed permanently after all retries. Review them under System Health > Email Delivery."
      - alert: EmailBacklogGrowing
        expr: toothcare_email_jobs_pending > 50
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Email outbox backlog is growing"
          description: "More than 50 emails have been waiting for 15 minutes. Check the email-worker container and SMTP availability."
      - alert: EmailDeliveryStalled
        expr: toothcare_email_jobs_pending > 0 and (time() - toothcare_email_last_success_timestamp_seconds) > 3600
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "No email delivered for over an hour while jobs are waiting"
          description: "The worker may be stopped, or SMTP may be unreachable or misconfigured."

  - name: toothcare-realtime
    rules:
      - alert: RealtimeOutboxBacklogGrowing
        expr: toothcare_realtime_outbox_pending > 50
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Real-time notification outbox backlog is growing"
          description: "More than 50 real-time events have been waiting for 5 minutes. Check realtime-worker and realtime containers."

      - alert: RealtimeOutboxPermanentFailures
        expr: toothcare_realtime_outbox_failed_total > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Real-time outbox events exhausted retries"
          description: "{{ $value }} real-time event(s) failed permanently. Persistent notifications remain available via REST."

      - alert: RealtimeHighAuthFailures
        expr: rate(toothcare_realtime_auth_failures_total[5m]) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Elevated Socket.IO handshake authentication failures"
          description: "Investigate expired tickets, secret drift, or unauthorized connection attempts."
