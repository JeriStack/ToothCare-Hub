# Prometheus scrape configuration for ToothCare Hub
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "rules/toothcare-alerts.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "toothcare-backend"
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ["backend:9000"]

  - job_name: "toothcare-realtime"
    metrics_path: /metrics
    static_configs:
      - targets: ["realtime:4000"]

  - job_name: "nginx"
    static_configs:
      - targets: ["nginx:80"]
