# =============================================================================
# ToothCare Hub — Hardened Production Docker Compose Overrides (Phase 20)
# Usage:
#   IMAGE_TAG=v1.0.0 docker compose -f compose.yaml -f compose.prod.yaml up -d
#
# Production Guarantees:
#   - Immutable multi-stage images (zero host source-code bind mounts)
#   - Only Nginx publishes public ports (80/443); MySQL, PHP-FPM, workers,
#     Socket.IO, Prometheus, and exporters remain strictly private
#   - Least-privilege security_opt (no-new-privileges) & resource limits
#   - Externalized TLS certs mounted read-only from ./docker/nginx/ssl
#   - Preserves persistent named volumes (mysql-data, backend-storage, prometheus-data, grafana-data)
# =============================================================================

services:
  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    image: ${IMAGE_REGISTRY:-ghcr.io/toothcare-hub}/toothcare-frontend:${IMAGE_TAG:-v1.0.0}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
    restart: always

  php-fpm:
    image: ${IMAGE_REGISTRY:-ghcr.io/toothcare-hub}/toothcare-backend:${IMAGE_TAG:-v1.0.0}
    environment:
      APP_DEBUG: "false"
      APP_ENV: "production"
      SESSION_COOKIE_SECURE: "true"
      SESSION_COOKIE_SAMESITE: "Lax"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 512M
    restart: always

  mysql:
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
    restart: always

  realtime:
    image: ${IMAGE_REGISTRY:-ghcr.io/toothcare-hub}/toothcare-realtime:${IMAGE_TAG:-v1.0.0}
    environment:
      NODE_ENV: "production"
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 256M
    restart: always

  realtime-worker:
    image: ${IMAGE_REGISTRY:-ghcr.io/toothcare-hub}/toothcare-backend:${IMAGE_TAG:-v1.0.0}
    user: "www-data:www-data"
    environment:
      APP_DEBUG: "false"
      APP_ENV: "production"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    restart: always

  email-worker:
    image: ${IMAGE_REGISTRY:-ghcr.io/toothcare-hub}/toothcare-backend:${IMAGE_TAG:-v1.0.0}
    user: "www-data:www-data"
    environment:
      APP_DEBUG: "false"
      APP_ENV: "production"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    restart: always

  reminder-scheduler:
    image: ${IMAGE_REGISTRY:-ghcr.io/toothcare-hub}/toothcare-backend:${IMAGE_TAG:-v1.0.0}
    user: "www-data:www-data"
    environment:
      APP_DEBUG: "false"
      APP_ENV: "production"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    restart: always

  db-backup:
    image: ${IMAGE_REGISTRY:-ghcr.io/toothcare-hub}/toothcare-backend:${IMAGE_TAG:-v1.0.0}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    restart: always

  prometheus:
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    restart: always

  grafana:
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    restart: always

  mysqld-exporter:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    restart: always

  nginx-exporter:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
    restart: always

  cadvisor:
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    restart: always
