# =============================================================================
# ToothCare Hub - Production Docker Compose Overrides
# Usage: docker compose -f compose.yaml -f compose.prod.yaml up -d
# Hardened production settings: HTTPS ports, strict production environment
# =============================================================================

services:
  nginx:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./frontend/dist:/var/www/frontend/dist:ro
      - ./backend/public:/var/www/backend/public:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    restart: always

  php-fpm:
    environment:
      APP_DEBUG: "false"
      APP_ENV: "production"
    restart: always

  mysql:
    restart: always

  realtime:
    environment:
      NODE_ENV: "production"
    restart: always

  email-worker:
    environment:
      APP_DEBUG: "false"
      APP_ENV: "production"
    restart: always

  prometheus:
    restart: always

  grafana:
    restart: always
