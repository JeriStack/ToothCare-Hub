    filter="url(#shadow)"
  />

  <!-- Inner Tooth Specular Highlight -->
  <path
    d="M22 13C17 13 13 17 14 23C15 28 17 32 19 40C20 37 21 34 23 32C25 29 28 27 32 27C36 27 39 29 41 32C43 34 44 37 45 40C47 32 49 28 50 23C51 17 47 13 42 13C37 13 34 16 32 16C30 16 27 13 22 13Z"
    fill="#E0F2FE"
