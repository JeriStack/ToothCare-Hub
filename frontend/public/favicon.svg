  />

  <!-- Orbital Swoosh Ring -->
  <path
    d="M8 36C8 30 18 25 32 25C46 25 56 30 56 36C56 42 46 47 32 47C18 47 8 42 8 36Z"
    stroke="url(#ringGrad)"
    stroke-width="4.5"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Cross (+) on right orbital ring tip -->
  <rect x="50" y="22" width="10" height="4" rx="2" fill="#2DD4BF" />
  <rect x="53" y="19" width="4" height="10" rx="2" fill="#2DD4BF" />
