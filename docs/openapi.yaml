openapi: 3.0.3
info:
  title: 'ToothCare Hub REST API'
  description: 'Authoritative native PHP REST API (/api/v1) for ToothCare Hub — Dental Appointment and Clinic Management System. Uses server-side PHP sessions (HttpOnly, SameSite=Lax cookie) with synchronizer CSRF tokens on state-changing requests and server-enforced DRBAC + resource ownership checks.'
  version: 1.0.0
servers:
  -
    url: /api/v1
    description: 'Same-origin API base path (Nginx reverse proxy / Vite dev proxy)'
  -
    url: 'http://localhost:8080/api/v1'
    description: 'Local Docker Compose Nginx edge gateway'
paths:
  /appointments:
    get:
      tags:
        - Appointments
      summary: 'List Authenticated Patient Appointments (Paginated)'
      operationId: listPatientAppointments
      parameters:
        -
          name: status
          in: query
          schema:
            type: string
            enum:
              - PENDING
              - CONFIRMED
              - REJECTED
              - CANCELLED
              - COMPLETED
        -
          name: start_date
          in: query
          schema:
            type: string
            format: date
        -
          name: end_date
          in: query
          schema:
            type: string
            format: date
        -
          name: dentist_id
          in: query
          schema:
            type: integer
        -
          name: service_id
          in: query
          schema:
            type: integer
        -
          name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
        -
          name: per_page
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
            minimum: 1
      responses:
        '200':
          description: 'Paginated patient appointments'
        '401':
          description: Unauthenticated
        '422':
          description: 'Invalid filter parameters'
      security:
        -
          CookieAuth: []
    post:
      tags:
        - Appointments
      summary: 'Request New Dental Appointment (Patient)'
      description: 'Validates active dentist/service, working hours, time-off, clinic closures, and uses InnoDB row locking (SELECT ... FOR UPDATE) with half-open interval non-overlap checks to prevent double booking.'
      operationId: bookAppointment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - dentist_id
                - service_id
                - start_at
              properties:
                dentist_id:
                  type: integer
                  example: 2
                service_id:
                  type: integer
                  example: 1
                start_at:
                  type: string
                  example: '2026-12-01 09:00:00'
                chief_complaint:
                  type: string
                  example: 'Routine dental cleaning'
                  nullable: true
              type: object
      responses:
        '201':
          description: 'Appointment requested (status: PENDING)'
        '401':
          description: Unauthenticated
        '409':
          description: 'Overlapping slot conflict'
        '422':
          description: 'Validation or scheduling policy violation'
      security:
        -
          CookieAuth: []
          CsrfToken: []
  /appointments/search:
    get:
      tags:
        - Appointments
      summary: 'Role-Scoped Appointment Search & Advanced Filtering'
      description: 'Enforces strict server-side role scoping: Admin/Receptionist search clinic-wide; Dentist strictly scoped to own dentist_id; Patient strictly scoped to own patient_id.'
      operationId: searchAppointments
      parameters:
        -
          name: start_date
          in: query
          schema:
            type: string
            format: date
        -
          name: end_date
          in: query
          schema:
            type: string
            format: date
        -
          name: dentist_id
          in: query
          schema:
            type: integer
        -
          name: patient_id
          in: query
          schema:
            type: integer
        -
          name: service_id
          in: query
          schema:
            type: integer
        -
          name: status
          in: query
          schema:
            type: string
            enum:
              - PENDING
              - CONFIRMED
              - REJECTED
              - CANCELLED
              - COMPLETED
        -
          name: search
          in: query
          schema:
            type: string
        -
          name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
        -
          name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
            minimum: 1
      responses:
        '200':
          description: 'Paginated search results'
        '401':
          description: Unauthenticated
        '422':
          description: 'Invalid filter or date range'
      security:
        -
          CookieAuth: []
  '/appointments/{id}':
    get:
      tags:
        - Appointments
      summary: 'Get Single Appointment with Status History (Owner/Admin)'
      operationId: getAppointmentById
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 'Appointment details'
        '400':
          description: 'Invalid ID'
        '403':
          description: Forbidden
        '404':
          description: 'Not found'
      security:
        -
          CookieAuth: []
  '/appointments/{id}/cancel':
    post:
      tags:
        - Appointments
      summary: 'Cancel Appointment (Enforces 24h Patient Cutoff for Confirmed Visits)'
      operationId: cancelAppointment
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 'Appointment cancelled'
        '403':
          description: 'Ownership denied'
        '422':
          description: 'Outside cancellation cutoff or invalid transition'
      security:
        -
          CookieAuth: []
          CsrfToken: []
  '/appointments/{id}/reschedule':
    post:
      tags:
        - Appointments
      summary: 'Reschedule Appointment (Atomic Cancel-and-Relink)'
      operationId: rescheduleAppointment
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '201':
          description: 'Replacement appointment created'
        '409':
          description: 'New slot conflict'
      security:
        -
          CookieAuth: []
          CsrfToken: []
  /admin/appointments:
    get:
      tags:
        - Appointments
      summary: 'List & Filter Clinic Appointments (Admin/Receptionist, Paginated)'
      operationId: listAdminAppointments
      responses:
        '200':
          description: 'Paginated appointments'
        '422':
          description: 'Invalid filters'
      security:
        -
          CookieAuth: []
  '/admin/appointments/{id}':
    get:
      tags:
        - Appointments
      summary: 'Get Appointment Details with Audit Trail (Admin/Receptionist)'
      operationId: getAdminAppointment
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 'Appointment details'
      security:
        -
          CookieAuth: []
  '/admin/appointments/{id}/confirm':
    patch:
      tags:
        - Appointments
      summary: 'Approve & Confirm Pending Appointment (Admin/Receptionist)'
      operationId: confirmAppointment
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 'Appointment confirmed'
        '409':
          description: 'Invalid transition or slot conflict'
      security:
        -
          CookieAuth: []
          CsrfToken: []
  '/admin/appointments/{id}/reject':
    patch:
      tags:
        - Appointments
      summary: 'Decline Pending Appointment with Reason (Admin/Receptionist)'
      operationId: rejectAppointment
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 'Appointment rejected'
      security:
        -
          CookieAuth: []
          CsrfToken: []
  '/admin/appointments/{id}/complete':
    patch:
      tags:
        - Appointments
      summary: 'Mark Confirmed Appointment Completed (Admin)'
      operationId: completeAdminAppointment
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 'Appointment completed'
        '409':
          description: 'Invalid status transition'
      security:
        -
          CookieAuth: []
          CsrfToken: []
  /dentist/appointments:
    get:
      tags:
        - Appointments
      summary: 'List Assigned Dentist Appointments (SQL Paginated)'
      operationId: listDentistAppointments
      responses:
        '200':
          description: 'Paginated assigned appointments'
      security:
        -
          CookieAuth: []
  '/dentist/appointments/{id}':
    get:
      tags:
        - Appointments
      summary: 'Get Assigned Dentist Appointment Detail (Ownership Enforced)'
      operationId: getDentistAppointment
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 'Assigned appointment detail'
        '403':
          description: 'Not assigned to this dentist'
      security:
        -
          CookieAuth: []
  '/dentist/appointments/{id}/complete':
    post:
      tags:
        - Appointments
      summary: 'Complete Assigned Appointment (POST, Dentist)'
      operationId: completeDentistAppointmentPost
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 'Appointment completed'
      security:
        -
          CookieAuth: []
          CsrfToken: []
    patch:
      tags:
        - Appointments
      summary: 'Complete Assigned Appointment (PATCH, Dentist)'
      operationId: completeDentistAppointmentPatch
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 'Appointment completed'
      security:
        -
          CookieAuth: []
          CsrfToken: []
  /receptionist/schedule/today:
    get:
      tags:
        - Receptionist
      summary: 'Get Today Clinic Arrival Schedule (Receptionist/Admin)'
      operationId: getReceptionistTodaySchedule
      responses:
        '200':
          description: 'Today schedule with attendance states'
      security:
        -
          CookieAuth: []
  '/receptionist/appointments/{id}/check-in':
    post:
      tags:
        - Receptionist
      summary: 'Check In Arriving Patient (Receptionist/Admin)'
      operationId: checkInPatient
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 'Patient checked in'
      security:
        -
          CookieAuth: []
          CsrfToken: []
  '/receptionist/appointments/{id}/attendance':
    patch:
      tags:
        - Receptionist
      summary: 'Update Operational Attendance State (Receptionist/Admin)'
      operationId: updatePatientAttendance
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 'Attendance updated'
      security:
        -
          CookieAuth: []
          CsrfToken: []
  /receptionist/waiting-list:
    get:
      tags:
        - Receptionist
      summary: 'Get Live Clinic Waiting Queue (Receptionist/Admin)'
      operationId: getReceptionistWaitingList
      responses:
        '200':
          description: 'Waiting queue'
      security:
        -
          CookieAuth: []
  /receptionist/patients:
    post:
      tags:
        - Receptionist
      summary: 'Register Walk-In Patient (Receptionist/Admin)'
      operationId: registerWalkInPatient
      responses:
        '201':
          description: 'Patient registered'
      security:
        -
          CookieAuth: []
          CsrfToken: []
  /receptionist/appointments:
    post:
      tags:
        - Receptionist
      summary: 'Create Front-Desk Appointment (Receptionist/Admin)'
      operationId: createFrontDeskAppointment
      responses:
        '201':
          description: 'Appointment created'
      security:
        -
          CookieAuth: []
          CsrfToken: []
  /treatment-records:
    get:
      tags:
        - Clinical
      summary: 'List Treatment Records (Dentist/Admin, Paginated)'
      operationId: listTreatmentRecords
      responses:
        '200':
          description: 'Paginated treatment records'
      security:
        -
          CookieAuth: []
    post:
      tags:
        - Clinical
      summary: 'Create Clinical Treatment Record (Dentist/Admin)'
      operationId: createTreatmentRecord
      responses:
        '201':
          description: 'Treatment record created'
      security:
        -
          CookieAuth: []
          CsrfToken: []
  '/treatment-records/{id}':
    get:
      tags:
        - Clinical
      summary: 'Get Treatment Record by ID (Dentist/Admin)'
      operationId: getTreatmentRecord
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 'Treatment record'
      security:
        -
          CookieAuth: []
    put:
      tags:
        - Clinical
      summary: 'Amend Treatment Record (PUT, Dentist/Admin)'
      operationId: putTreatmentRecord
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 'Treatment record amended'
      security:
        -
          CookieAuth: []
          CsrfToken: []
    patch:
      tags:
        - Clinical
      summary: 'Amend Treatment Record (PATCH, Dentist/Admin)'
      operationId: patchTreatmentRecord
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 'Treatment record amended'
      security:
        -
          CookieAuth: []
          CsrfToken: []
  '/appointments/{id}/treatment-record':
    get:
      tags:
        - Clinical
      summary: 'Get Treatment Record Linked to Appointment (Dentist/Admin)'
      operationId: getAppointmentTreatmentRecord
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 'Treatment record'
      security:
        -
          CookieAuth: []
  /health:
    get:
      tags:
        - Health
      summary: 'API Health & Readiness Check'
      operationId: getHealth
      parameters:
        -
          name: check
          in: query
          schema:
            type: string
            enum:
              - ready
      responses:
        '200':
          description: 'Service is healthy'
        '503':
          description: 'Database dependency degraded'
  /metrics:
    get:
      tags:
        - Health
      summary: 'Prometheus Metrics Exposition'
      operationId: getPrometheusMetrics
      responses:
        '200':
          description: 'Prometheus text metrics'
  /auth/csrf-token:
    get:
      tags:
        - Authentication
      summary: 'Retrieve Synchronizer CSRF Token'
      operationId: getCsrfToken
      responses:
        '200':
          description: 'CSRF token issued for current session'
  /auth/register:
    post:
      tags:
        - Authentication
      summary: 'Register Patient Account'
      description: 'Creates a new PATIENT account (role escalation attempts are ignored server-side) and queues an email verification message.'
      operationId: registerPatient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - first_name
                - last_name
                - email
                - password
                - phone
                - date_of_birth
                - accept_legal
                - terms_version
                - privacy_version
              properties:
                first_name:
                  type: string
                  example: Ana
                last_name:
                  type: string
                  example: Reyes
                email:
                  type: string
                  format: email
                  example: ana.reyes@example.com
                password:
                  type: string
                  format: password
                  minLength: 8
                phone:
                  type: string
                  example: '+63 917 123 4567'
                date_of_birth:
                  type: string
                  format: date
                  example: '1993-04-12'
                gender:
                  type: string
                  enum: [MALE, FEMALE, OTHER, PREFER_NOT_TO_SAY]
                accept_legal:
                  description: 'Explicit acceptance of Terms of Service and acknowledgment of Privacy Policy'
                  type: boolean
                  example: true
                terms_version:
                  description: 'Must match currently PUBLISHED Terms of Service version'
                  type: string
                  example: '1.0'
                privacy_version:
                  description: 'Must match currently PUBLISHED Privacy Policy version'
                  type: string
                  example: '1.0'
              type: object
      responses:
        '201':
          description: 'Patient registered'
        '409':
          description: 'Email already exists'
        '422':
          description: 'Validation error'
        '429':
          description: 'Rate limit exceeded'
      security:
        -
          CsrfToken: []
  /auth/login:
    post:
      tags:
        - Authentication
      summary: 'Authenticate User & Create Session Cookie'
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: patient.demo@example.com
                password:
                  type: string
                  format: password
                remember_me:
                  type: boolean
                  example: false
              type: object
      responses:
        '200':
          description: 'Authenticated; session cookie issued'
        '401':
          description: 'Invalid credentials'
        '403':
          description: 'Account suspended or email unverified'
        '429':
          description: 'Login rate limited'
      security:
        -
          CsrfToken: []
  /auth/logout:
    post:
      tags:
        - Authentication
      summary: 'Invalidate Session & Revoke Real-Time Connections'
      operationId: logoutUser
      responses:
        '200':
          description: 'Logged out cleanly'
        '401':
          description: Unauthenticated
      security:
        -
          CookieAuth: []
          CsrfToken: []
  /auth/verify-email:
    post:
      tags:
        - Authentication
      summary: 'Verify Account Email Using Single-Use Token'
      operationId: verifyEmail
      responses:
        '200':
          description: 'Email verified'
        '400':
          description: 'Invalid or expired token'
      security:
        -
          CsrfToken: []
  /auth/resend-verification:
    post:
      tags:
        - Authentication
      summary: 'Resend Verification Email'
      operationId: resendVerificationEmail
      responses:
        '200':
          description: 'Verification email queued if account exists'
      security:
        -
          CsrfToken: []
  /auth/forgot-password:
    post:
      tags:
        - Authentication
      summary: 'Request Password Reset Link'
      operationId: forgotPassword
      responses:
        '200':
          description: 'Reset link queued if account exists'
      security:
        -
          CsrfToken: []
  /auth/password/forgot:
    post:
      tags:
        - Authentication
      summary: 'Request Password Reset Link (Alias)'
      operationId: forgotPasswordAlias
      responses:
        '200':
          description: 'Reset link queued if account exists'
      security:
        -
          CsrfToken: []
  /auth/reset-password:
    post:
      tags:
        - Authentication
      summary: 'Reset Password Using Single-Use Token'
      operationId: resetPassword
      responses:
        '200':
          description: 'Password reset succeeded'
        '400':
          description: 'Invalid or expired token'
        '422':
          description: 'Password policy validation failed'
      security:
        -
          CsrfToken: []
  /auth/password/reset:
    post:
      tags:
        - Authentication
      summary: 'Reset Password (Alias)'
      operationId: resetPasswordAlias
      responses:
        '200':
          description: 'Password reset succeeded'
      security:
        -
          CsrfToken: []
  /auth/me:
    get:
      tags:
        - Authentication
      summary: 'Get Authenticated User Identity & Permissions'
      operationId: getCurrentUser
      responses:
        '200':
          description: 'Current user identity'
        '401':
          description: Unauthenticated
      security:
        -
          CookieAuth: []
    patch:
      tags:
        - Users
      summary: 'Update Authenticated User Profile'
      operationId: updateCurrentUser
      responses:
        '200':
          description: 'Profile updated'
      security:
        -
          CookieAuth: []
          CsrfToken: []
  /auth/me/avatar:
    get:
      tags:
        - Users
      summary: 'Serve Authenticated User Avatar'
      operationId: getMyAuthAvatar
      responses:
        '200':
          description: 'Image binary'
      security:
        -
          CookieAuth: []
    post:
      tags:
        - Users
      summary: 'Upload Authenticated User Avatar'
      operationId: uploadMyAuthAvatar
      responses:
        '200':
          description: 'Avatar uploaded'
      security:
        -
          CookieAuth: []
          CsrfToken: []
    delete:
      tags:
        - Users
      summary: 'Remove Authenticated User Avatar'
      operationId: deleteMyAuthAvatar
      responses:
        '200':
          description: 'Avatar removed'
      security:
        -
          CookieAuth: []
          CsrfToken: []
  /user/profile:
    get:
      tags:
        - Users
      summary: 'Get Staff/User Self-Service Profile'
      operationId: getUserProfile
      responses:
        '200':
          description: 'Profile retrieved'
      security:
        -
          CookieAuth: []
    patch:
      tags:
        - Users
      summary: 'Update Staff/User Self-Service Profile'
      operationId: updateUserProfile
      responses:
        '200':
          description: 'Profile updated'
      security:
        -
          CookieAuth: []
          CsrfToken: []
  /user/profile/avatar:
    get:
      tags:
        - Users
      summary: 'Serve Self-Service User Avatar'
      operationId: getUserProfileAvatar
      responses:
        '200':
          description: 'Image binary'
      security:
        -
          CookieAuth: []
    post:
      tags:
        - Users
      summary: 'Upload Self-Service User Avatar'
      operationId: uploadUserProfileAvatar
      responses:
        '200':
          description: 'Avatar uploaded'
      security:
        -
          CookieAuth: []
          CsrfToken: []
    delete:
      tags:
        - Users
      summary: 'Delete Self-Service User Avatar'
      operationId: deleteUserProfileAvatar
      responses:
        '200':
          description: 'Avatar removed'
      security:
        -
          CookieAuth: []
          CsrfToken: []
  '/users/{id}/avatar':
    get:
      tags:
        - Users
      summary: 'Serve User Avatar by ID (Owner or Clinical/Admin Staff)'
      operationId: getUserAvatarById
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 'Image binary (private cache)'
        '401':
          description: Unauthenticated
        '403':
          description: 'Forbidden — cross-user avatar access denied'
        '404':
          description: 'Avatar not found'
      security:
        -
          CookieAuth: []
  /admin/users:
    get:
      tags:
        - Users
      summary: 'List All User Accounts (Admin, Paginated)'
      operationId: listAdminUsers
      parameters:
        -
          name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
        -
          name: per_page
          in: query
          schema:
            type: integer
            default: 15
            maximum: 100
            minimum: 1
        -
          name: limit
          in: query
          schema:
            type: integer
            maximum: 100
            minimum: 1
        -
          name: search
          in: query
          schema:
            type: string
        -
          name: role
          in: query
          schema:
            type: string
      responses:
        '200':
          description: 'Paginated user list'
        '403':
          description: 'Requires users.view'
      security:
        -
          CookieAuth: []
    post:
      tags:
        - Users
      summary: 'Create Staff/User Account (Admin)'
      operationId: createAdminUser
      responses:
        '201':
          description: 'User created'
        '403':
          description: 'Requires users.manage'
      security:
        -
          CookieAuth: []
          CsrfToken: []
  '/admin/users/{id}':
    get:
      tags:
        - Users
      summary: 'Get Single User Account Details (Admin)'
      operationId: getAdminUser
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 'User details'
        '404':
          description: 'Not found'
      security:
        -
          CookieAuth: []
  '/admin/users/{id}/status':
    patch:
      tags:
        - Users
      summary: 'Activate or Deactivate User Account (Admin)'
      operationId: updateAdminUserStatus
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
