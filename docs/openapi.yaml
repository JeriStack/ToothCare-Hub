components:
  schemas:
    ResponseMeta:
      properties:
        request_id:
          type: string
          example: req-9f8e7d6c
        message:
          type: string
          nullable: true
        total:
          type: integer
          example: 42
          nullable: true
        page:
          type: integer
          example: 1
          nullable: true
        per_page:
          type: integer
          example: 20
          nullable: true
        last_page:
          type: integer
          example: 3
          nullable: true
      type: object
    ErrorDetail:
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: 'The given data was invalid.'
        details:
          type: object
          nullable: true
          additionalProperties: true
      type: object
    SuccessEnvelope:
      required:
        - data
        - meta
        - error
      properties:
        data:
          nullable: true
        meta:
          $ref: '#/components/schemas/ResponseMeta'
        error:
          type: object
          example: null
          nullable: true
      type: object
    ErrorEnvelope:
      required:
        - data
        - meta
        - error
      properties:
        data:
          example: null
          nullable: true
        meta:
          $ref: '#/components/schemas/ResponseMeta'
        error:
          $ref: '#/components/schemas/ErrorDetail'
      type: object
    PaginationMeta:
      required:
        - total
        - page
        - per_page
        - last_page
      properties:
        total:
          type: integer
          example: 120
        page:
          type: integer
          minimum: 1
          example: 1
        per_page:
          type: integer
          maximum: 100
          minimum: 1
          example: 20
        last_page:
          type: integer
          minimum: 1
          example: 6
      type: object
    User:
      properties:
        id:
          type: integer
          example: 10
        email:
          type: string
          format: email
          example: patient.demo@example.com
        first_name:
          type: string
          example: Ana
          nullable: true
        last_name:
          type: string
          example: Reyes
          nullable: true
        role:
          type: string
          enum:
            - ADMIN
            - RECEPTIONIST
            - DENTIST
            - PATIENT
        is_active:
          type: boolean
          example: true
        email_verified:
          type: boolean
          example: true
        avatar_url:
          type: string
          example: /api/v1/users/10/avatar
          nullable: true
        created_at:
          type: string
          format: date-time
      type: object
    Patient:
      properties:
        id:
          type: integer
          example: 5
        user_id:
          type: integer
          example: 10
        first_name:
          type: string
          example: Ana
        last_name:
          type: string
          example: Reyes
        date_of_birth:
          type: string
          format: date
          example: '1993-04-12'
        phone:
          type: string
          example: '09171234567'
        gender:
          type: string
          enum:
            - MALE
            - FEMALE
            - OTHER
            - PREFER_NOT_TO_SAY
        address:
          type: string
          nullable: true
        avatar_url:
          type: string
          nullable: true
      type: object
    Dentist:
      properties:
        id:
          type: integer
          example: 2
        user_id:
          type: integer
          example: 4
        first_name:
          type: string
          example: Clara
        last_name:
          type: string
          example: Mendoza
        specialization:
          type: string
          example: 'General Dentistry'
        license_number:
          type: string
          example: PRC-2026-001
        default_operatory_chair:
          type: string
          example: 'Chair 1'
        is_active:
          type: boolean
          example: true
        avatar_url:
          type: string
          nullable: true
      type: object
    Service:
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: 'Dental Prophylaxis (Cleaning)'
        category:
          type: string
          example: Preventive
        description:
          type: string
          nullable: true
        price:
          type: number
          format: float
          example: 1500
        duration_minutes:
          type: integer
          enum:
            - 15
            - 30
            - 45
            - 60
            - 90
            - 120
          example: 30
        is_active:
          type: boolean
          example: true
      type: object
    Appointment:
      properties:
        id:
          type: integer
          example: 101
        patient_id:
          type: integer
          example: 5
        dentist_id:
          type: integer
          example: 2
        service_id:
          type: integer
          example: 1
        start_at:
          type: string
          example: '2026-12-01 09:00:00'
        end_at:
          type: string
          example: '2026-12-01 09:30:00'
        duration_snapshot:
          type: integer
          example: 30
        price_snapshot:
          type: number
          format: float
          example: 1500
        status:
          type: string
          enum:
            - PENDING
            - CONFIRMED
            - REJECTED
            - CANCELLED
            - COMPLETED
        operatory_chair:
          type: string
          example: 'Chair 1'
        rescheduled_from_id:
          type: integer
          nullable: true
        cancellation_reason:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
      type: object
    AppointmentStatusHistory:
      properties:
        id:
          type: integer
          example: 12
        appointment_id:
          type: integer
          example: 101
        old_status:
          type: string
          example: PENDING
          nullable: true
        new_status:
          type: string
          example: CONFIRMED
        actor_user_id:
          type: integer
          nullable: true
        reason:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
      type: object
    Notification:
      properties:
        id:
          type: integer
          example: 501
        user_id:
          type: integer
          example: 10
        role:
          type: string
          enum:
            - ADMIN
            - RECEPTIONIST
            - DENTIST
            - PATIENT
        type:
          type: string
          example: APPOINTMENT_CONFIRMED
        title:
          type: string
          example: 'Appointment Confirmed'
        message:
          type: string
          example: 'Your dental visit has been confirmed.'
        reference_type:
          type: string
          example: appointments
        reference_id:
          type: integer
          example: 101
          nullable: true
        read_at:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
      type: object
    TreatmentRecord:
      properties:
        id:
          type: integer
          example: 21
        appointment_id:
          type: integer
          example: 101
        dentist_id:
          type: integer
          example: 2
        patient_id:
          type: integer
          example: 5
        teeth_treated:
          type: string
          example: '11, 21'
          nullable: true
        diagnosis:
          type: string
          example: 'Mild plaque buildup'
        procedure_notes:
          type: string
          example: 'Ultrasonic scaling completed'
        created_at:
          type: string
          format: date-time
      type: object
    DashboardSummary:
      properties:
        counts:
          type: object
        appointment_trends:
          type: array
          items:
            type: object
        outbox_summary:
          type: object
        recent_errors:
          type: array
          items:
            type: object
        timezone:
          type: string
          example: Asia/Manila
        generated_at:
          type: string
          format: date-time
      type: object
    OperationalError:
      properties:
        id:
          type: string
          example: email-42
        timestamp:
          type: string
        severity:
          type: string
          enum:
            - WARNING
            - ERROR
        module:
          type: string
          example: email_outbox
        correlation_id:
          type: string
        summary:
          description: 'Redacted operational summary (no stack traces, paths, or secrets).'
          type: string
        resolution_status:
          type: string
      type: object
  securitySchemes:
    CookieAuth:
      type: apiKey
      description: 'Server-side PHP session cookie (HttpOnly, SameSite=Lax, Secure in production).'
      name: toothcare_session
      in: cookie
    CsrfToken:
      type: apiKey
      description: 'Synchronizer CSRF token obtained from GET /api/v1/auth/csrf-token; required on POST, PUT, PATCH, and DELETE requests.'
      name: X-CSRF-Token
      in: header
tags:
  -
    name: Health
    description: 'Liveness, readiness, and Prometheus metrics'
  -
    name: Authentication
    description: 'Session authentication, registration, CSRF, email verification, and password reset'
  -
    name: Users
    description: 'Self-service user profiles, avatars, and administrator account management'
  -
    name: RBAC
    description: 'Dynamic Role-Based Access Control (DRBAC) roles and permissions matrix'
  -
    name: Patients
    description: 'Patient self-service profiles and front-desk/admin patient directory'
  -
    name: Dentists
    description: 'Public dentist directory, dentist self-service profile, schedules, time-off, and admin roster'
  -
    name: Services
    description: 'Public dental service catalog and administrative service management'
  -
    name: Scheduling
    description: 'Clinic operating hours, closures, and real-time slot availability'
  -
    name: Appointments
    description: 'Appointment booking, role-scoped search, triage review, cancellation, rescheduling, and completion'
  -
    name: Receptionist
    description: 'Front-desk workspace, daily arrival check-ins, waiting queue, and walk-in intake'
  -
    name: Clinical
    description: 'Versioned clinical treatment records and FDI tooth charting'
  -
    name: Notifications
    description: 'Persistent in-app notifications and Socket.IO real-time connection tickets'
  -
    name: Dashboards
    description: 'Role-appropriate database-driven executive, receptionist, dentist, and patient dashboards'
  -
    name: Reports
    description: 'Database-driven operational reports (appointments, service utilization, dentist workload, patients)'
  -
    name: Operations
    description: 'Audit logs, security events, email/realtime outbox monitoring, and redacted operational errors'
  -
    name: Settings
    description: 'Clinic-wide configuration settings'
  -
    name: Legal
    description: 'Public Terms of Service and Privacy Policy documents, versioning, and auditable user legal acceptance records'
