name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 8.5 resolves to the latest 8.5 patch (>= 8.5.12, the security
        # release fixing CVE-2026-109618 / CVE-2026-109619).
        php-version: ["8.5"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: pdo, pdo_mysql, json
          coverage: none
          tools: composer

      - name: Validate composer.json
        working-directory: backend
        run: composer validate --strict

      - name: Install dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist

      - name: PHP lint (syntax check)
        working-directory: backend
        run: find src public config -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Run PHPUnit
        working-directory: backend
        run: ./vendor/bin/phpunit

      - name: Generate / validate OpenAPI spec
        working-directory: backend
        run: composer run openapi

  frontend:
    name: Frontend (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Production build
        working-directory: frontend
        run: npm run build
