# =============================================================================
# ToothCare Hub - Base Docker Compose Specification (Compose v2)
# Service topology: Nginx edge proxy, PHP-FPM API, MySQL database,
# Node.js realtime service, background email worker, and optional observability.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # 1. Edge Reverse Proxy (Public Entry Point)
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:stable-alpine3.24
    container_name: toothcare-nginx
    depends_on:
      php-fpm:
        condition: service_healthy
      realtime:
        condition: service_healthy
    networks:
      - edge
      - app
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health || exit 1"]
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # 2. Native PHP-FPM REST API
  # ---------------------------------------------------------------------------
  php-fpm:
    build:
      context: ./backend
      dockerfile: ../docker/php/Dockerfile
    image: toothcare-php-fpm:latest
    container_name: toothcare-php-fpm
    env_file:
      - path: .env
        required: false
      - path: ./backend/.env
        required: false
    environment:
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-toothcare_hub}
      DB_USER: ${DB_USER:-toothcare_user}
      DB_USERNAME: ${DB_USER:-toothcare_user}
      DB_PASSWORD: ${DB_PASSWORD:-toothcare_secure_pass}
      APP_ENV: ${APP_ENV:-development}
      APP_DEBUG: ${APP_DEBUG:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8080,http://127.0.0.1:5173,http://127.0.0.1:8080,http://localhost:3000,http://127.0.0.1:3000}
      REALTIME_ENABLED: ${REALTIME_ENABLED:-true}
      REALTIME_INTERNAL_URL: ${REALTIME_INTERNAL_URL:-http://realtime:4000}
      REALTIME_INTERNAL_SECRET: ${REALTIME_INTERNAL_SECRET:-dev_realtime_secret_change_in_prod_32chars}
    volumes:
      - backend-storage:/var/www/backend/storage
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "php -r '$$fp = @fsockopen(\"127.0.0.1\", 9000, $$errno, $$errstr, 2); exit($$fp ? 0 : 1);'"]
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # 3. Relational Database (MySQL 8.0)
  # ---------------------------------------------------------------------------
  mysql:
    image: mysql:26.10
    container_name: toothcare-mysql
    environment:
      MYSQL_DATABASE: ${DB_NAME:-toothcare_hub}
      MYSQL_USER: ${DB_USER:-toothcare_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-toothcare_secure_pass}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secure_pass}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root --password=$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # 3b. Web Database Management (phpMyAdmin)
  # ---------------------------------------------------------------------------
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: toothcare-phpmyadmin
    profiles:
      - tools
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_ARBITRARY: 0
      UPLOAD_LIMIT: 64M
    ports:
      - "${PHPMYADMIN_PORT:-8085}:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # 4. Real-Time Service (Node.js + Socket.IO)
  # ---------------------------------------------------------------------------
  realtime:
    build:
      context: ./realtime
      dockerfile: Dockerfile
    image: toothcare-realtime:latest
    container_name: toothcare-realtime
    env_file:
      - path: .env
        required: false
      - path: ./realtime/.env
        required: false
    environment:
      PORT: ${REALTIME_PORT:-4000}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8080,http://127.0.0.1:5173,http://127.0.0.1:8080}
      BACKEND_INTERNAL_API_URL: ${BACKEND_INTERNAL_API_URL:-http://nginx:8081}
      REALTIME_INTERNAL_SECRET: ${REALTIME_INTERNAL_SECRET:-dev_realtime_secret_change_in_prod_32chars}
      NODE_ENV: ${NODE_ENV:-development}
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/health || exit 1"]
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # 4b. Background Real-Time Outbox Worker (Publishes committed MySQL outbox events)
  # ---------------------------------------------------------------------------
  realtime-worker:
    image: toothcare-php-fpm:latest
    container_name: toothcare-realtime-worker
    command: ["php", "bin/realtime-worker.php"]
    stop_signal: SIGTERM
    stop_grace_period: 30s
    env_file:
      - path: .env
        required: false
      - path: ./backend/.env
        required: false
    environment:
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-toothcare_hub}
      DB_USER: ${DB_USER:-toothcare_user}
      DB_USERNAME: ${DB_USER:-toothcare_user}
      DB_PASSWORD: ${DB_PASSWORD:-toothcare_secure_pass}
      APP_ENV: ${APP_ENV:-development}
      REALTIME_ENABLED: ${REALTIME_ENABLED:-true}
      REALTIME_INTERNAL_URL: ${REALTIME_INTERNAL_URL:-http://realtime:4000}
      REALTIME_INTERNAL_SECRET: ${REALTIME_INTERNAL_SECRET:-dev_realtime_secret_change_in_prod_32chars}
      LOG_PATH: /var/www/backend/storage/logs/realtime-worker.log
    volumes:
      - backend-storage:/var/www/backend/storage
    depends_on:
      php-fpm:
        condition: service_healthy
      mysql:
        condition: service_healthy
      realtime:
        condition: service_healthy
    networks:
      - app
    healthcheck:
      test: ["CMD", "php", "bin/realtime-worker.php", "--status"]
      interval: 60s
      timeout: 10s
      start_period: 15s
      retries: 3
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # 5. Background Email Worker (Reuses PHP image with dedicated CLI daemon)
  # ---------------------------------------------------------------------------
  email-worker:
    image: toothcare-php-fpm:latest
    container_name: toothcare-email-worker
    command: ["php", "bin/email-worker.php"]
    stop_signal: SIGTERM
    stop_grace_period: 30s
    env_file:
      - path: .env
        required: false
      - path: ./backend/.env
        required: false
    environment:
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-toothcare_hub}
      DB_USER: ${DB_USER:-toothcare_user}
      DB_USERNAME: ${DB_USER:-toothcare_user}
      DB_PASSWORD: ${DB_PASSWORD:-toothcare_secure_pass}
      APP_ENV: ${APP_ENV:-development}
      # SMTP and worker settings come from backend/.env (env_file) or the deployment's secret store.
      LOG_PATH: /var/www/backend/storage/logs/email-worker.log
    volumes:
      - backend-storage:/var/www/backend/storage
    depends_on:
      php-fpm:
        condition: service_healthy
      mysql:
        condition: service_healthy
    networks:
      - app
    healthcheck:
      # Validates configuration and database access, and prints queue statistics.
      test: ["CMD", "php", "bin/email-worker.php", "--status"]
      interval: 60s
      timeout: 10s
      start_period: 15s
      retries: 3
    restart: unless-stopped
  # ---------------------------------------------------------------------------
  # 5b. Appointment Reminder Scheduler (reuses the PHP image; runs the idempotent
  #     scheduler every REMINDER_SCHEDULER_INTERVAL_SECONDS. Run exactly one instance.)
  # ---------------------------------------------------------------------------
  reminder-scheduler:
    image: toothcare-php-fpm:latest
    container_name: toothcare-reminder-scheduler
    entrypoint: ["sh", "-c"]
    command:
      - |
        echo "ToothCare Hub reminder scheduler started."
        while true; do
          php bin/schedule-reminders.php || true
          sleep "$${REMINDER_SCHEDULER_INTERVAL_SECONDS:-300}"
        done
    stop_grace_period: 10s
    env_file:
      - path: .env
        required: false
      - path: ./backend/.env
        required: false
    environment:
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-toothcare_hub}
      DB_USER: ${DB_USER:-toothcare_user}
      DB_USERNAME: ${DB_USER:-toothcare_user}
      DB_PASSWORD: ${DB_PASSWORD:-toothcare_secure_pass}
      APP_ENV: ${APP_ENV:-development}
      LOG_PATH: /var/www/backend/storage/logs/reminder-scheduler.log
    volumes:
      - backend-storage:/var/www/backend/storage
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app
    healthcheck:
      # Read-only probe: configuration and database reachability (no scheduling side effects).
      test: ["CMD", "php", "bin/email-worker.php", "--status"]
      interval: 60s
      timeout: 10s
      start_period: 15s
      retries: 3
    restart: unless-stopped

