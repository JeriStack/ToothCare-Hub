  # 6. Database Automated Backup Daemon (2:00 AM Daily Full Backup + Retention)
  # ---------------------------------------------------------------------------
  db-backup:
    image: toothcare-php-fpm:latest
    container_name: toothcare-db-backup
    entrypoint: ["sh", "-c"]
    command:
      - |
        echo "ToothCare Hub Backup Daemon Initialized."
        while true; do
          HOUR=$$(date +%H)
          MIN=$$(date +%M)
          if [ "$$HOUR" = "02" ] && [ "$$MIN" = "00" ]; then
            echo "[CRON] Triggering automated 02:00 AM database backup..."
            php /var/www/backend/database/scripts/backup.php --type=daily || true
            php /var/www/backend/database/scripts/cleanup-backups.php --days=30 || true
            sleep 65
          fi
          sleep 30
        done
    env_file:
      - path: .env
        required: false
      - path: ./backend/.env
        required: false
    environment:
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-toothcare_hub}
      DB_USER: ${DB_USER:-toothcare_user}
      DB_USERNAME: ${DB_USER:-toothcare_user}
      DB_PASSWORD: ${DB_PASSWORD:-toothcare_secure_pass}
      BACKUP_STORAGE_DIR: /var/www/backups
      BACKUP_ENCRYPTION_ENABLED: ${BACKUP_ENCRYPTION_ENABLED:-true}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
    volumes:
      - ./backups:/var/www/backups
      - ./database/scripts:/var/www/backend/database/scripts:ro
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app
    healthcheck:
      disable: true
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # 6. Observability Stack (Optional Monitoring Profile — Phase 19)
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.16.0
    container_name: toothcare-prometheus
    profiles:
      - monitoring
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}"
      - "--web.enable-lifecycle"
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    networks:
      - app
      - monitoring
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.3.1
    container_name: toothcare-grafana
    profiles:
      - monitoring
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - monitoring
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 3s
      start_period: 15s
      retries: 3
    restart: unless-stopped

  mysqld-exporter:
    image: prom/mysqld-exporter:v0.21.0
    container_name: toothcare-mysqld-exporter
    profiles:
      - monitoring
    environment:
      DATA_SOURCE_NAME: "${MYSQL_EXPORTER_USER:-toothcare_exporter}:${MYSQL_EXPORTER_PASSWORD:-change_me_exporter_pass}@(mysql:3306)/"
    command:
      - "--mysqld.address=mysql:3306"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app
      - monitoring
    restart: unless-stopped

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    container_name: toothcare-nginx-exporter
    profiles:
      - monitoring
    command:
      - "--nginx.scrape-uri=http://nginx:8081/stub_status"
    depends_on:
      nginx:
        condition: service_healthy
    networks:
      - app
      - monitoring
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: toothcare-cadvisor
    profiles:
      - monitoring
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - monitoring
    restart: unless-stopped

  # Linux staging/production host exporter only (Windows Docker Desktop does not expose native Windows host metrics)
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: toothcare-node-exporter
    profiles:
      - monitoring-linux
    command:
      - "--path.rootfs=/host"
    volumes:
      - /:/host:ro,rslave
    networks:
      - monitoring
    restart: unless-stopped

networks:
  edge:
    name: toothcare_edge
    driver: bridge
  app:
    name: toothcare_app
    driver: bridge
  monitoring:
    name: toothcare_monitoring
    driver: bridge

volumes:
  mysql-data:
    name: toothcare_mysql_data
  backend-storage:
    name: toothcare_backend_storage
  prometheus-data:
    name: toothcare_prometheus_data
  grafana-data:
    name: toothcare_grafana_data
