# =============================================================================
# ToothCare Hub - Base Docker Compose Specification (Compose v2)
# Service topology: Nginx edge proxy, PHP-FPM API, MySQL database,
# Node.js realtime service, background email worker, and optional observability.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # 1. Edge Reverse Proxy (Public Entry Point)
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: toothcare-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./frontend/dist:/var/www/frontend/dist:ro
      - ./backend/public:/var/www/backend/public:ro
    ports:
      - "${NGINX_PORT:-8080}:80"
    depends_on:
      php-fpm:
        condition: service_healthy
      realtime:
        condition: service_healthy
    networks:
      - edge
      - app
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health || exit 1"]
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # 2. Native PHP-FPM REST API
  # ---------------------------------------------------------------------------
  php-fpm:
    build:
      context: ./backend
      dockerfile: ../docker/php/Dockerfile
    image: toothcare-php-fpm:latest
    container_name: toothcare-php-fpm
    env_file:
      - path: .env
        required: false
      - path: ./backend/.env
        required: false
    environment:
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-toothcare_hub}
      DB_USER: ${DB_USER:-toothcare_user}
      DB_PASSWORD: ${DB_PASSWORD:-toothcare_secure_pass}
      APP_ENV: ${APP_ENV:-development}
      APP_DEBUG: ${APP_DEBUG:-true}
    volumes:
      - ./backend/public:/var/www/backend/public:ro
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "php -r '$$fp = @fsockopen(\"127.0.0.1\", 9000, $$errno, $$errstr, 2); exit($$fp ? 0 : 1);'"]
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # 3. Relational Database (MySQL 8.0)
  # ---------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: toothcare-mysql
    environment:
      MYSQL_DATABASE: ${DB_NAME:-toothcare_hub}
      MYSQL_USER: ${DB_USER:-toothcare_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-toothcare_secure_pass}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secure_pass}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root --password=$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # 4. Real-Time Service (Node.js + Socket.IO)
  # ---------------------------------------------------------------------------
  realtime:
    build:
      context: ./realtime
      dockerfile: Dockerfile
    image: toothcare-realtime:latest
    container_name: toothcare-realtime
    env_file:
      - path: .env
        required: false
      - path: ./realtime/.env
        required: false
    environment:
      PORT: ${REALTIME_PORT:-4000}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8080}
      NODE_ENV: ${NODE_ENV:-development}
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/health || exit 1"]
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # 5. Background Email Worker (Reuses PHP image with dedicated CLI daemon)
  # ---------------------------------------------------------------------------
  email-worker:
    image: toothcare-php-fpm:latest
    container_name: toothcare-email-worker
    command: ["php", "src/Jobs/ProcessEmailOutbox.php"]
    env_file:
      - path: .env
        required: false
      - path: ./backend/.env
        required: false
    environment:
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-toothcare_hub}
      DB_USER: ${DB_USER:-toothcare_user}
      DB_PASSWORD: ${DB_PASSWORD:-toothcare_secure_pass}
      WORKER_POLL_INTERVAL_SECONDS: ${WORKER_POLL_INTERVAL_SECONDS:-5}
      APP_ENV: ${APP_ENV:-development}
    depends_on:
      php-fpm:
        condition: service_healthy
      mysql:
        condition: service_healthy
    networks:
      - app
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # 6. Observability Stack (Optional Monitoring Profile)
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.53.1
    container_name: toothcare-prometheus
    profiles:
      - monitoring
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - app
      - monitoring
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    container_name: toothcare-grafana
    profiles:
      - monitoring
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - monitoring
    restart: unless-stopped

  mysqld-exporter:
    image: prom/mysqld-exporter:v0.15.1
    container_name: toothcare-mysqld-exporter
    profiles:
      - monitoring
    environment:
      DATA_SOURCE_NAME: "${DB_USER:-toothcare_user}:${DB_PASSWORD:-toothcare_secure_pass}@(${DB_HOST:-mysql}:3306)/${DB_NAME:-toothcare_hub}"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app
      - monitoring
    restart: unless-stopped

networks:
  edge:
    name: toothcare_edge
    driver: bridge
  app:
    name: toothcare_app
    driver: bridge
  monitoring:
    name: toothcare_monitoring
    driver: bridge

volumes:
  mysql-data:
    name: toothcare_mysql_data
  prometheus-data:
    name: toothcare_prometheus_data
  grafana-data:
    name: toothcare_grafana_data
