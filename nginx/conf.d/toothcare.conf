# ToothCare Hub - Nginx Reverse Proxy Configuration
# Directs public web traffic to the appropriate service container:
#   /          -> Frontend SPA static assets (/var/www/frontend/dist) with client-side fallback
#   /api/      -> Backend PHP-FPM FastCGI (php-fpm:9000, front controller /var/www/backend/public/index.php)
#   /socket.io -> Real-time Socket.IO WebSocket proxy (realtime:4000)
#   /health    -> Nginx self health check endpoint
#
# Note: Uses Docker embedded DNS (127.0.0.11) with variable-based upstream names so
# recreating php-fpm or realtime containers never leaves Nginx with a stale container IP (502 Bad Gateway).

server {
    listen 80 default_server;
    server_name _;

    resolver 127.0.0.11 valid=5s ipv6=off;
    set $php_fpm_upstream "php-fpm:9000";
    set $realtime_upstream "http://realtime:4000";

    root /var/www/frontend/dist;
    index index.html;
    charset utf-8;

    # Include centralized security headers
    include /etc/nginx/snippets/security-headers.conf;

    # Nginx self health check endpoint (does not hit PHP or realtime upstream)
    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"healthy","service":"toothcare-nginx","timestamp":"$time_iso8601"}\n';
    }

    # Frontend SPA: serve static files, fallback to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Block internal service-to-service endpoints and raw Prometheus metrics on the public edge port
    location ^~ /api/v1/internal/ {
        deny all;
        return 403;
    }

    location = /api/v1/metrics {
        deny all;
        return 403;
    }

    # Local/Development Swagger UI shortcut (/api-docs -> PHP OpenApiDocsController, returns 404 in production)
    location = /api-docs {
        fastcgi_pass $php_fpm_upstream;
        include /etc/nginx/snippets/fastcgi-params.conf;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI /api/v1/docs;
        fastcgi_param DOCUMENT_ROOT /var/www/backend/public;
        fastcgi_intercept_errors off;
    }

    # Allow PHP-guarded OpenAPI YAML endpoint (returns 404 in production) before static .yaml deny regex
    location = /api/v1/docs/openapi.yaml {
        fastcgi_pass $php_fpm_upstream;
        include /etc/nginx/snippets/fastcgi-params.conf;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param DOCUMENT_ROOT /var/www/backend/public;
        fastcgi_intercept_errors off;
    }

    # Backend API via PHP-FPM FastCGI
    location /api/ {
        client_max_body_size 5m;
        fastcgi_pass $php_fpm_upstream;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include /etc/nginx/snippets/fastcgi-params.conf;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param DOCUMENT_ROOT /var/www/backend/public;
        fastcgi_intercept_errors off;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;
    }

    # Socket.IO Real-time WebSocket Proxy
    location /socket.io/ {
        proxy_pass $realtime_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    # Deny direct access to hidden/dot files (.env, .git, etc.)
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny direct access to sensitive backend/source patterns
    location ~* /(config|src|tests|vendor|storage|database)/ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny access to sensitive extensions
    location ~* \.(env|git|yml|yaml|sql|md|log|ini|sh|bak)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# Internal-only Docker network listener for PHP <-> Node.js service-to-service verification.
# Port 8081 is NEVER published in Docker Compose `ports:` and only routes `/api/v1/internal/` and `/api/v1/metrics`.
server {
    listen 8081;
    server_name _;

    resolver 127.0.0.11 valid=5s ipv6=off;
    set $php_fpm_upstream "php-fpm:9000";

    location ^~ /api/v1/internal/ {
        client_max_body_size 256k;
        fastcgi_pass $php_fpm_upstream;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include /etc/nginx/snippets/fastcgi-params.conf;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param DOCUMENT_ROOT /var/www/backend/public;
        fastcgi_intercept_errors off;
    }

    location = /api/v1/metrics {
        fastcgi_pass $php_fpm_upstream;
        include /etc/nginx/snippets/fastcgi-params.conf;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param DOCUMENT_ROOT /var/www/backend/public;
        fastcgi_intercept_errors off;
    }

    # Internal-only Nginx stub_status for nginx-prometheus-exporter (never exposed on public port 80)
    location = /stub_status {
        stub_status on;
        access_log off;
    }

    location / {
        return 404;
    }
}
