# Reverse proxy for ToothCare Hub
# Routes:
#   /          -> frontend (static SPA)
#   /api/      -> backend PHP-FPM
#   /socket.io -> realtime Socket.IO service
#   /health    -> minimal health status

upstream php_backend {
    server backend:9000;
}

upstream realtime_service {
    server realtime:4000;
}

server {
    listen 80;
    server_name _;

    root /var/www/backend/public;
    index index.php;

    include /etc/nginx/snippets/security-headers.conf;

    # Minimal public health check route
    location /health {
        access_log off;
        return 200 '{"status":"ok","timestamp":"$time_iso8601"}';
        add_header Content-Type application/json;
    }

    # Frontend SPA
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API via PHP-FPM
    location /api/ {
        try_files $uri /index.php$is_args$args;
    }

    location ~ \.php$ {
        fastcgi_pass php_backend;
        fastcgi_index index.php;
        include /etc/nginx/snippets/fastcgi-params.conf;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param REQUEST_URI $request_uri;
    }

    # Socket.IO (WebSocket upgrade)
    location /socket.io/ {
        proxy_pass http://realtime_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Deny access to sensitive or hidden files
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }
}
