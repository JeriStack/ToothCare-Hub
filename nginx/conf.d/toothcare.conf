# ToothCare Hub - Nginx Reverse Proxy Configuration
# Directs public web traffic to the appropriate service container:
#   /          -> Frontend SPA static assets (/var/www/frontend/dist) with client-side fallback
#   /api/      -> Backend PHP-FPM FastCGI (php-fpm:9000, front controller /var/www/backend/public/index.php)
#   /socket.io -> Real-time Socket.IO WebSocket proxy (realtime:4000)
#   /health    -> Nginx self health check endpoint

upstream php_fpm_backend {
    server php-fpm:9000;
    keepalive 16;
}

upstream realtime_service {
    server realtime:4000;
    keepalive 16;
}

server {
    listen 80 default_server;
    server_name _;

    root /var/www/frontend/dist;
    index index.html;
    charset utf-8;

    # Include centralized security headers
    include /etc/nginx/snippets/security-headers.conf;

    # Nginx self health check endpoint (does not hit PHP or realtime upstream)
    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"healthy","service":"toothcare-nginx","timestamp":"$time_iso8601"}\n';
    }

    # Frontend SPA: serve static files, fallback to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend API via PHP-FPM FastCGI
    location /api/ {
        fastcgi_pass php_fpm_backend;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include /etc/nginx/snippets/fastcgi-params.conf;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param DOCUMENT_ROOT /var/www/backend/public;
        fastcgi_intercept_errors off;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;
    }

    # Socket.IO Real-time WebSocket Proxy
    location /socket.io/ {
        proxy_pass http://realtime_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    # Deny direct access to hidden/dot files (.env, .git, etc.)
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny direct access to sensitive backend/source patterns
    location ~* /(config|src|tests|vendor|storage|database)/ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny access to sensitive extensions
    location ~* \.(env|git|yml|yaml|sql|md|log|ini|sh|bak)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}
